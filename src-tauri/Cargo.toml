[package]
name = "oni-a650-pro"
version = "0.2.0-preview.8"
description = "ONI A650 / A650M Engineering Configurator PRO 2.0 (Rust + Tauri v2)"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "a650_core"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oni-a650-pro"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [], optional = true }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
csv = "1.3"
serialport = "4.5"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.0.0", features = [], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation"] }
tempfile = "3.10"

[dev-dependencies]
tempfile = "3.10"
