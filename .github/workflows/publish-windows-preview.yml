name: Publish Windows v0.2.0-preview.3

on:
  push:
    branches: [release/v0.2.0-preview.3]

permissions: {}

concurrency:
  group: publish-oni-a650-pro-v0.2.0-preview.3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.2.0-preview.3
      SOURCE_SHA: 6f08ea7c62709e5903b03a21cd0e3356c9d38552
      SOURCE_RUN_ID: '44595690628'
      ARTIFACT_ID: '14565817239'
      ZIP_NAME: oni-a650-pro-0.2.0-preview.3-windows-x64.zip
      ZIP_SHA256: 879a097835d615fac742de66651c4080da6717e84072d0cf6b25d73405d64569

    steps:
      - name: Verify Windows CI and exact artifact source
        shell: bash
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID")
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_SHA"
          test "$(jq -r '.head_branch' <<<"$run_json")" = 'main'
          test "$(jq -r '.status' <<<"$run_json")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          artifact_json=$(gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID")
          test "$(jq -r '.workflow_run.id' <<<"$artifact_json")" = "$SOURCE_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact_json")" = "$SOURCE_SHA"
          test "$(jq -r '.expired' <<<"$artifact_json")" = 'false'
          test "$(jq -r '.digest' <<<"$artifact_json")" = "sha256:$ZIP_SHA256"

      - name: Download, verify and publish Windows prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite it"
            exit 1
          fi
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$ZIP_NAME"
          printf '%s  %s\n' "$ZIP_SHA256" "$ZIP_NAME" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          unzip -t "$ZIP_NAME"
          unzip -Z1 "$ZIP_NAME" | grep -Fxq 'oni-a650-pro.exe'
          cat > notes.md <<'NOTES'
          ## ONI A650 PRO 0.2.0-preview.3 — Windows x64

          Stand-test prerelease from main commit 6f08ea7c62709e5903b03a21cd0e3356c9d38552, including merged PR #6.

          ### What changed since preview.2
          - Fix reverse-running frequency in the U00.00 (0x3000) telemetry: the FC03 raw 16-bit register is interpreted as signed int16 in F15.08=0 mode, and scaled by 0.01 Hz.
          - Example: raw 0xEC78 represents -5000, so the display now reads -50.00 Hz, not a large positive number.
          - Oscilloscope now has a symmetric frequency axis with zero in the center; negative frequency crosses below the zero line rather than being clipped.
          - Added the raw frequency value to the diagnostic tooltip, including hexadecimal value, to simplify comparison with the inverter.
          - Simulator supports reverse frequency. Signed int16 values are decoded when reading typed catalog parameters.
          - Added Rust and JavaScript tests for signed frequency and oscilloscope coordinates.

          ### Installation
          Download the Windows x64 ZIP, extract it, and run `oni-a650-pro.exe`. Microsoft Edge WebView2 Runtime must be installed.

          ### Verification and safety limitations
          - Source: `6f08ea7c62709e5903b03a21cd0e3356c9d38552`.
          - [Windows CI run #44595690628](https://github.com/uzbatsu-beep/oni-a650-pro/actions/runs/44595690628): Rust tests, JavaScript oscilloscope tests, release EXE build, window-start smoke test and artifact upload all passed.
          - **This updated version has not yet been physically tested on the inverter.** Prior physical tests were on preview.2.
          - The frequency is signed when parameter F15.08 = 0 (factory default). With F15.08 = 1, U00.00 reports the absolute frequency; do not infer a negative sign from it alone.
          - Start the physical verification in **Read-Only** mode; compare +50, 0, and -50 Hz, the raw 0x3000 register value and the waveform crossing zero.
          - Do not use unrestricted parameter writes or drive control without a separate safety acceptance; strengthening of SafetyGuard is planned.

          [PR #6](https://github.com/uzbatsu-beep/oni-a650-pro/pull/6) · [Verification checklist](https://github.com/uzbatsu-beep/oni-a650-pro/blob/6f08ea7c62709e5903b03a21cd0e3356c9d38552/docs/REVERSE_FREQUENCY_VERIFICATION.md) · [Source commit](https://github.com/uzbatsu-beep/oni-a650-pro/commit/6f08ea7c62709e5903b03a21cd0e3356c9d38552)
          NOTES
          gh release create "$RELEASE_TAG" "$ZIP_NAME" SHA256SUMS.txt \
            --target "$SOURCE_SHA" --prerelease \
            --title 'ONI A650 PRO 0.2.0-preview.3 для Windows x64' \
            --notes-file notes.md
